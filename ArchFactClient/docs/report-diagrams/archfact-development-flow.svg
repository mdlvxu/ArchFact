<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="620" viewBox="0 0 2000 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="1" stop-color="#f3e9df"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9531d"/>
      <stop offset="1" stop-color="#d27a35"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#654631" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#a97b5b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #302a25; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #776d65; }
      .step { font-size: 13px; font-weight: 700; fill: #fff; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-note { font-size: 12px; fill: #746a62; }
      .arrow { fill: none; stroke: #a97b5b; stroke-width: 2.8; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #6e9abe; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2000" height="620" fill="url(#bg)"/>
  <circle cx="1925" cy="40" r="170" fill="#e6c5a9" opacity="0.16"/>
  <circle cx="80" cy="600" r="170" fill="#a9c5d8" opacity="0.10"/>
  <text x="70" y="66" class="title">ArchFact 项目开发与业务处理流程</text>
  <text x="70" y="96" class="subtitle">从 PDF 输入到结构化数据、关系核验和版本导出的完整闭环</text>

  <!-- main guide line -->
  <path d="M155 310 H1835" stroke="#e2d1c4" stroke-width="5" stroke-linecap="round"/>

  <!-- 01 -->
  <g filter="url(#shadow)">
    <rect x="55" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="92" cy="245" r="21" fill="url(#brand)"/>
  <text x="92" y="250" text-anchor="middle" class="step">01</text>
  <rect x="84" y="285" width="118" height="50" rx="12" fill="#fff1e5"/>
  <path d="M113 319h60v-22h-60zm12-30h36l-8-9h-20z" fill="none" stroke="#aa5824" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="142" y="365" text-anchor="middle" class="card-title">上传 PDF</text>
  <text x="142" y="389" text-anchor="middle" class="card-note">选择模板、规则与页码</text>

  <!-- 02 -->
  <path d="M230 310 H265" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="275" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="312" cy="245" r="21" fill="url(#brand)"/>
  <text x="312" y="250" text-anchor="middle" class="step">02</text>
  <rect x="305" y="285" width="115" height="50" rx="12" fill="#f2f6f9"/>
  <path d="M330 295h65v30h-65zm9 9h47m-47 8h34" fill="none" stroke="#5b829c" stroke-width="2.4"/>
  <text x="362" y="365" text-anchor="middle" class="card-title">创建抽取任务</text>
  <text x="362" y="389" text-anchor="middle" class="card-note">异步执行与实时进度</text>

  <!-- 03 -->
  <path d="M450 310 H485" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="495" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="532" cy="245" r="21" fill="url(#brand)"/>
  <text x="532" y="250" text-anchor="middle" class="step">03</text>
  <rect x="527" y="283" width="110" height="54" rx="12" fill="#eef4f8"/>
  <path d="M553 293h45l12 12v23h-57zm45 0v13h12M563 314h34m-34 7h26" fill="none" stroke="#567d98" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="582" y="365" text-anchor="middle" class="card-title">PDF 预处理</text>
  <text x="582" y="389" text-anchor="middle" class="card-note">文字层、分页与 OCR</text>

  <!-- 04 parallel intelligence -->
  <path d="M670 310 H705" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="715" y="165" width="230" height="290" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="752" cy="200" r="21" fill="url(#brand)"/>
  <text x="752" y="205" text-anchor="middle" class="step">04</text>
  <text x="830" y="210" text-anchor="middle" class="card-title">双通道智能提取</text>
  <rect x="748" y="240" width="164" height="76" rx="12" fill="#edf6fc" stroke="#c0d7e6"/>
  <text x="830" y="268" text-anchor="middle" class="card-title" font-size="15">OCR → 大模型</text>
  <text x="830" y="292" text-anchor="middle" class="card-note">结构化器物字段</text>
  <rect x="748" y="337" width="164" height="76" rx="12" fill="#fff1e9" stroke="#e4c0a7"/>
  <text x="830" y="365" text-anchor="middle" class="card-title" font-size="15">PDF 图像 → YOLO</text>
  <text x="830" y="389" text-anchor="middle" class="card-note">器物、序号、图注裁剪</text>
  <path d="M830 316 V329" class="branch"/>

  <!-- 05 -->
  <path d="M945 310 H980" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="990" y="210" width="195" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="1027" cy="245" r="21" fill="url(#brand)"/>
  <text x="1027" y="250" text-anchor="middle" class="step">05</text>
  <circle cx="1050" cy="306" r="13" fill="#e6f2e2" stroke="#77a866" stroke-width="2"/>
  <circle cx="1125" cy="285" r="13" fill="#fff0d9" stroke="#c68b3b" stroke-width="2"/>
  <circle cx="1125" cy="329" r="13" fill="#e8f1f7" stroke="#6995b2" stroke-width="2"/>
  <path d="M1063 303 L1111 288M1063 309 L1111 326" class="branch"/>
  <text x="1087" y="365" text-anchor="middle" class="card-title">关系匹配</text>
  <text x="1087" y="389" text-anchor="middle" class="card-note">图注→序号→器物→彩图</text>

  <!-- 06 -->
  <path d="M1185 310 H1220" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1230" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="1267" cy="245" r="21" fill="url(#brand)"/>
  <text x="1267" y="250" text-anchor="middle" class="step">06</text>
  <ellipse cx="1317" cy="292" rx="43" ry="13" fill="#edf6ef" stroke="#78a785" stroke-width="2"/>
  <path d="M1274 292v35c0 7 19 13 43 13s43-6 43-13v-35M1274 309c0 7 19 13 43 13s43-6 43-13" fill="none" stroke="#78a785" stroke-width="2"/>
  <text x="1317" y="365" text-anchor="middle" class="card-title">融合与存储</text>
  <text x="1317" y="389" text-anchor="middle" class="card-note">记录、区域、关系与图片</text>

  <!-- 07 -->
  <path d="M1405 310 H1440" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1450" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="1487" cy="245" r="21" fill="url(#brand)"/>
  <text x="1487" y="250" text-anchor="middle" class="step">07</text>
  <rect x="1485" y="282" width="105" height="61" rx="8" fill="#eef5fa" stroke="#6f99b4" stroke-width="2"/>
  <path d="M1498 296h79m-79 11h46m-46 11h66m-66 11h36" stroke="#6f99b4" stroke-width="2"/>
  <circle cx="1573" cy="325" r="6" fill="#d56f31"/>
  <text x="1537" y="365" text-anchor="middle" class="card-title">数据预览</text>
  <text x="1537" y="389" text-anchor="middle" class="card-note">器物卡片、证据框与连线</text>

  <!-- 08 -->
  <path d="M1625 310 H1660" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1670" y="210" width="175" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="1707" cy="245" r="21" fill="url(#brand)"/>
  <text x="1707" y="250" text-anchor="middle" class="step">08</text>
  <circle cx="1720" cy="306" r="23" fill="#e9f6eb" stroke="#56a467" stroke-width="2"/>
  <path d="M1709 306l8 8 16-19" fill="none" stroke="#4c9d5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1755" y="284" width="55" height="44" rx="9" fill="#fce9e7" stroke="#d96b62"/>
  <path d="M1771 297l22 20m0-20l-22 20" stroke="#ce574f" stroke-width="3" stroke-linecap="round"/>
  <text x="1757" y="365" text-anchor="middle" class="card-title">固定样本核验</text>
  <text x="1757" y="389" text-anchor="middle" class="card-note">18条样本 · PASS / FAIL</text>

  <!-- 09 -->
  <path d="M1845 310 H1870" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1880" y="210" width="75" height="200" rx="17" fill="#fffdfb" stroke="#dfcdbf"/>
  </g>
  <circle cx="1917" cy="245" r="21" fill="url(#brand)"/>
  <text x="1917" y="250" text-anchor="middle" class="step">09</text>
  <rect x="1900" y="282" width="35" height="56" rx="7" fill="#fff0df" stroke="#c47b3f"/>
  <text x="1917" y="304" text-anchor="middle" class="step" fill="#a9531d">V1</text>
  <text x="1917" y="325" text-anchor="middle" class="step" fill="#a9531d">V2</text>
  <text x="1917" y="365" text-anchor="middle" class="card-title" font-size="14">版本</text>
  <text x="1917" y="386" text-anchor="middle" class="card-note">导出</text>

  <!-- footer status -->
  <rect x="70" y="500" width="1860" height="72" rx="15" fill="#fffdfb" stroke="#e1d2c6"/>
  <circle cx="105" cy="536" r="8" fill="#4fa568"/>
  <text x="125" y="541" class="card-title" font-size="15">当前进度</text>
  <text x="235" y="541" class="card-note" font-size="14">核心业务闭环已完成</text>
  <circle cx="535" cy="536" r="8" fill="#d59a3c"/>
  <text x="555" y="541" class="card-title" font-size="15">下一阶段</text>
  <text x="665" y="541" class="card-note" font-size="14">30～50条真实数据验收</text>
  <circle cx="1010" cy="536" r="8" fill="#6d98b4"/>
  <text x="1030" y="541" class="card-title" font-size="15">后续优化</text>
  <text x="1140" y="541" class="card-note" font-size="14">数百页 PDF 性能、正式导出与生产部署</text>
</svg>
