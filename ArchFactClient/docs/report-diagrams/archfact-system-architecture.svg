<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f4"/>
      <stop offset="1" stop-color="#f4ebe2"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9531d"/>
      <stop offset="1" stop-color="#d27a35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#62432e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b765b"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #302a25; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #766b62; }
      .layer-title { font-size: 17px; font-weight: 700; fill: #8f4b20; }
      .layer-index { font-size: 12px; font-weight: 700; fill: #fff; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-note { font-size: 13px; fill: #71675f; }
      .tag { font-size: 12px; font-weight: 600; }
      .flow { fill: none; stroke: #9b765b; stroke-width: 2.4; marker-end: url(#arrow); }
      .inner-flow { fill: none; stroke: #6f9cc2; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <circle cx="1495" cy="55" r="150" fill="#e7c8ad" opacity="0.16"/>
  <circle cx="90" cy="865" r="170" fill="#abc7d9" opacity="0.12"/>

  <text x="80" y="65" class="title">ArchFact 整体系统架构</text>
  <text x="80" y="94" class="subtitle">前端交互、任务服务、智能处理与数据存储四层解耦；模型可替换，业务接口保持稳定</text>
  <rect x="1322" y="52" width="198" height="34" rx="17" fill="#fff" stroke="#dfc6b3"/>
  <circle cx="1346" cy="69" r="6" fill="#4fa568"/>
  <text x="1362" y="74" class="tag" fill="#58635b">核心链路已打通</text>

  <!-- Presentation layer -->
  <rect x="80" y="125" width="1440" height="140" rx="18" fill="#fffdfb" stroke="#e4d4c7" filter="url(#shadow)"/>
  <circle cx="114" cy="158" r="17" fill="url(#brand)"/>
  <text x="110" y="163" text-anchor="middle" class="layer-index">1</text>
  <text x="142" y="164" class="layer-title">交互层</text>

  <rect x="220" y="155" width="180" height="80" rx="14" fill="#fff3e7" stroke="#dfb88f"/>
  <circle cx="260" cy="190" r="18" fill="#b45d25" opacity="0.15"/>
  <path d="M252 187a8 8 0 1 1 16 0c0 5-3 8-8 8s-8-3-8-8zm-6 24c2-8 8-12 14-12s12 4 14 12" fill="none" stroke="#a9531d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="290" y="187" class="card-title">用户</text>
  <text x="290" y="208" class="card-note">配置、预览、核验</text>

  <rect x="495" y="145" width="795" height="100" rx="15" fill="#f7fbfe" stroke="#bad0df"/>
  <text x="525" y="177" class="card-title">Vue 3 前端</text>
  <text x="525" y="201" class="card-note">TypeScript · Vite · Element Plus · PDF.js</text>
  <rect x="790" y="165" width="142" height="44" rx="10" fill="#e8f2f8"/>
  <text x="861" y="191" text-anchor="middle" class="tag" fill="#416d8d">数据提取</text>
  <rect x="948" y="165" width="142" height="44" rx="10" fill="#e8f2f8"/>
  <text x="1019" y="191" text-anchor="middle" class="tag" fill="#416d8d">数据预览</text>
  <rect x="1106" y="165" width="154" height="44" rx="10" fill="#e8f2f8"/>
  <text x="1183" y="191" text-anchor="middle" class="tag" fill="#416d8d">机器核验</text>
  <path d="M400 195 H480" class="flow"/>

  <!-- Service layer -->
  <rect x="80" y="305" width="1440" height="140" rx="18" fill="#fffdfb" stroke="#e4d4c7" filter="url(#shadow)"/>
  <circle cx="114" cy="338" r="17" fill="url(#brand)"/>
  <text x="110" y="343" text-anchor="middle" class="layer-index">2</text>
  <text x="142" y="344" class="layer-title">服务层</text>

  <rect x="220" y="335" width="310" height="80" rx="14" fill="#fff4e9" stroke="#e1bc99"/>
  <text x="250" y="367" class="card-title">FastAPI 统一业务接口</text>
  <text x="250" y="391" class="card-note">文档接口 · 抽取任务接口 · 核验接口</text>
  <rect x="650" y="335" width="310" height="80" rx="14" fill="#f8f5f1" stroke="#d9cec5"/>
  <text x="680" y="367" class="card-title">异步任务与进度管理</text>
  <text x="680" y="391" class="card-note">创建 · 执行 · 取消 · 重试 · 日志</text>
  <rect x="1080" y="335" width="310" height="80" rx="14" fill="#f4f8f3" stroke="#c5d8c4"/>
  <text x="1110" y="367" class="card-title">结果与版本服务</text>
  <text x="1110" y="391" class="card-note">关系版本 · 人工保护 · V1/V2 导出</text>
  <path d="M530 375 H635" class="flow"/>
  <path d="M960 375 H1065" class="flow"/>
  <path d="M893 265 V292 H375 V320" class="flow"/>

  <!-- Intelligence layer -->
  <rect x="80" y="485" width="1440" height="230" rx="18" fill="#fffdfb" stroke="#e4d4c7" filter="url(#shadow)"/>
  <circle cx="114" cy="518" r="17" fill="url(#brand)"/>
  <text x="110" y="523" text-anchor="middle" class="layer-index">3</text>
  <text x="142" y="524" class="layer-title">智能处理层</text>

  <rect x="190" y="545" width="250" height="120" rx="14" fill="#f6f8fa" stroke="#cbd6de"/>
  <rect x="212" y="563" width="52" height="28" rx="8" fill="#dfeaf1"/>
  <text x="238" y="582" text-anchor="middle" class="tag" fill="#436b86">PDF</text>
  <text x="286" y="584" class="card-title">解析与 OCR</text>
  <text x="220" y="618" class="card-note">文字层提取 · 分页渲染</text>
  <text x="220" y="642" class="card-note">Tesseract 中英文识别</text>

  <rect x="510" y="525" width="270" height="75" rx="14" fill="#f0f7fc" stroke="#b8d2e4"/>
  <text x="540" y="557" class="card-title">通用大模型结构化</text>
  <text x="540" y="580" class="card-note">动态字段模板 · 文本分块 · JSON 校验</text>
  <rect x="510" y="620" width="270" height="75" rx="14" fill="#fff3ec" stroke="#e4c0a8"/>
  <text x="540" y="652" class="card-title">YOLO 区域检测</text>
  <text x="540" y="675" class="card-note">器物 · 序号 · 图注 · 裁剪图</text>

  <rect x="890" y="545" width="275" height="120" rx="14" fill="#f4f8ef" stroke="#c6d9b9"/>
  <text x="920" y="580" class="card-title">关系匹配</text>
  <text x="920" y="608" class="card-note">结构化文本 → 图注 → 序号 → 器物</text>
  <text x="920" y="632" class="card-note">同页 / 跨页 / 远距离彩图</text>

  <rect x="1250" y="545" width="205" height="120" rx="14" fill="#fff4e9" stroke="#e1bc99"/>
  <text x="1280" y="580" class="card-title">结果融合</text>
  <text x="1280" y="608" class="card-note">器物卡片</text>
  <text x="1280" y="632" class="card-note">证据链与置信度</text>

  <path d="M440 585 H495" class="inner-flow"/>
  <path d="M440 625 H495" class="inner-flow"/>
  <path d="M780 562 H875" class="inner-flow"/>
  <path d="M780 657 H815 V622 H875" class="inner-flow"/>
  <path d="M1165 605 H1235" class="inner-flow"/>
  <path d="M805 445 V470 H315 V530" class="flow"/>

  <!-- Data layer -->
  <rect x="80" y="755" width="1440" height="125" rx="18" fill="#fffdfb" stroke="#e4d4c7" filter="url(#shadow)"/>
  <circle cx="114" cy="788" r="17" fill="url(#brand)"/>
  <text x="110" y="793" text-anchor="middle" class="layer-index">4</text>
  <text x="142" y="794" class="layer-title">数据层</text>

  <rect x="255" y="785" width="320" height="65" rx="13" fill="#eef7f1" stroke="#bfd7c5"/>
  <text x="285" y="813" class="card-title">MongoDB</text>
  <text x="285" y="836" class="card-note">任务、记录、区域、关系与审核版本</text>
  <rect x="660" y="785" width="300" height="65" rx="13" fill="#eef3f8" stroke="#c0d1df"/>
  <text x="690" y="813" class="card-title">GridFS</text>
  <text x="690" y="836" class="card-note">原始 PDF 文件</text>
  <rect x="1045" y="785" width="330" height="65" rx="13" fill="#fff3e8" stroke="#dfbea0"/>
  <text x="1075" y="813" class="card-title">本地文件系统</text>
  <text x="1075" y="836" class="card-note">分页图、OCR图和器物裁剪图</text>

  <path d="M1352 665 V735 H415 V770" class="flow"/>
  <path d="M315 665 V735 H810 V770" class="flow"/>
  <path d="M645 695 V730 H1210 V770" class="flow"/>
</svg>
