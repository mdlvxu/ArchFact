[project]
name = "archfact-server"
version = "0.1.0"
description = "ArchFact PDF extraction API"
requires-python = ">=3.11"
dependencies = [
  "cozepy>=0.19.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "pillow>=11.0.0,<12.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "pymongo>=4.13.0,<5.0.0",
  "pymupdf>=1.25.0,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.11.0,<1.0.0",
]
yolo = [
  "dill==0.4.1",
  "ultralytics==8.4.96",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
